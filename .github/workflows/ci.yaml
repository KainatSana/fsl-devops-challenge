name: CI Pipeline

on:
  pull_request:
    branches:
      - devel

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install dependencies
        run: npm install

      - name: Make build script executable
        run: chmod +x build.sh

      - name: Run linter
        run: npm run lint

      - name: Check formatting
        run: npm run prettier -- --check .

      - name: Run tests
        env:
          CI: true
        run: npm run test

      - name: Build project
        run: ./build.sh
