name: CI Pipeline

on:
  pull_request:
    branches:
      - prod

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '20.19.4'

      - name: Install dependencies
        run: npm install

      - name: Run linter
        run: npm run lint

      - name: Run formatter
        run: npm run prettier -- --write

      - name: Run tests
        env:
          CI: true
        run: npm run test -- --coverage --watchAll=false

      - name: Build project
        run: npm run build
